version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - revive
  exclusions:
    rules:
      # Benchmarks and tests intentionally use loopback servers and fixed inputs.
      - path: _test\.go
        linters:
          - gosec
      # Test handlers implement fixed signatures and often ignore one argument.
      - path: _test\.go
        linters:
          - revive
        text: unused-parameter
      # README snippets are kept verbatim, without package comments.
      - path: examples/
        linters:
          - revive
        text: package-comments

formatters:
  enable:
    - gofmt
